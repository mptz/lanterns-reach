\* Liveness, cross-client: F3 (every withdrawn actor is freed) under weak fairness and a diligent client.
SPECIFICATION Spec
CONSTANTS
    Shape = "cross"
    NWorkers = 2
    MaxSpan = 1
    Diligent = TRUE
    NoCascadeCompleted = FALSE
    NoRegWdCheck = FALSE
    EdgesAtClaim = FALSE
    BatchTwo = FALSE
    NoClaimWdCheck = FALSE
    PublishDespiteWd = FALSE
    EarlyCleanup = FALSE
    TrackC5 = FALSE
    TrackProbes = FALSE
    FindAlways = FALSE
    ClientEndFair = TRUE
INVARIANTS TypeOK
PROPERTIES F3
