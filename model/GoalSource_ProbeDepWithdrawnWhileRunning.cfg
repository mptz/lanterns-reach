    Shape = "diamond"
    NWorkers = 2
    MaxSpan = 1
    Diligent = FALSE
    NoCascadeCompleted = FALSE
    NoRegWdCheck = FALSE
    EdgesAtClaim = FALSE
    BatchTwo = FALSE
    NoClaimWdCheck = FALSE
    PublishDespiteWd = FALSE
    EarlyCleanup = FALSE
    TrackC5 = FALSE
    TrackProbes = FALSE
    FindAlways = FALSE
    ClientEndFair = TRUE
INVARIANTS ProbeDepWithdrawnWhileRunning
