\* Variant (b), expected to fail: retire's G is read before the
\* unlink (tag = that G + 1). K = 2: with one object nothing else is pending,
\* so G can't move between the read and the unlink.
SPECIFICATION Spec
CONSTANTS
    N = 2
    K = 2
    TagMode = "G+1"
    ReadGBeforeUnlink = TRUE
    OnlineCopiesG = TRUE
    ResolveBeforeOnline = FALSE
    UseTicker = TRUE
    BumpOnlyIfNeeded = TRUE
    SplitCopy = TRUE
    FrameMayGoOffline = TRUE
INVARIANTS TypeOK NoUseAfterFree
