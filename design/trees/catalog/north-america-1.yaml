  rank: group
  stands_for:
  - Populus grandidentata (bigtooth aspen)
  distinct_from:
  - 'cottonwood: lowland riparian poplar'
  - 'balsam-poplar: resinous buds'
  tier: 1
  status: extant
  inclusion:
  - striking
  - folklore
  - well-known
  - product
  habitat:
    range: Alaska and across Canada to Newfoundland, south through the Rockies to northern Mexico; the
      most widely distributed tree in North America; bigtooth aspen in the northeast
    ecosystem: boreal forest, montane forest and aspen parkland
    climate:
      temperature:
      - cold
      - cool-temperate
      moisture:
      - subhumid
      - humid
      note: 'temperature: cold to cool-temperate; moisture: subhumid to humid'
    elevation_m:
    - 0
    - 3500
    substrate: wide range, best on deep moist loams; often on burned or disturbed ground
    niche: pioneer after fire and clearing; large single-clone groves that sucker from a shared root system
    strata:
    - canopy
    shade_tolerance: intolerant
    period: null
  form:
    habit: slender straight trunk with a short rounded crown; grows in clonal groves of many stems
    height_m:
    - 15
    - 30
    trunk_diameter_m:
    - 0.2
    - 0.6
    lifespan_y: 317
    growth_rate: fast
    leaves: deciduous broadleaf; small round leaves with a short point and fine teeth on long flattened
      stalks, so they quiver in the slightest breeze
    seasonal: whole hillsides turn gold, sometimes orange-red, in autumn; neighbouring clones change colour
      on different days
    flowers: drooping grey-brown catkins in early spring before the leaves
    fruit_visible: catkins of small capsules releasing cottony seed in late spring
    bark: smooth, greenish-white to cream with a chalky powder, black knots and scars; dark and furrowed
      only near the base of old stems
  timber:
    heartwood: light brown
    sapwood: wide, pale yellow to nearly white, blending into the heartwood
    grain: straight
    texture: uniform, medium
    density_kg_m3: 415
    janka_n: 1560
    workability: easy with hand and machine tools; planes fuzzy unless cutters are sharp; poor nail holding;
      warps in drying
    rot_resistance: non-durable; susceptible to insects
    scent: none
    fuel: light, quick-burning, little heat; low-smoke and does not spark
    uses:
    - pulp and paper
    - boxes and crates
    - plywood and veneer
    - matches
    - excelsior
    - sauna benches
    - chopsticks
  products:
    food:
    - inner bark and cambium eaten in spring by Indigenous peoples
    sap_resin_latex: []
    bark:
    - inner bark used medicinally; chalky bark powder rubbed on skin as a folk sunscreen
    leaves: []
    dyes: []
    medicinal:
    - bark contains salicin (the source of the willow-family aspirin-like compounds)
    - used for fever and pain
    toxicity: null
  lore:
    folklore:
    - European Christian legend that aspen trembles because the Cross was made of its wood or because
      it alone did not bow to Christ; applied to aspens in general
    - Plains peoples' accounts of the leaves as talking or whispering
    cultures:
    - important browse and beaver food in fur-trade country
    - Basque sheepherders' arborglyphs carved on aspens in Nevada and the western ranges
    symbolism:
    - state tree of Utah (2014)
    notable_trees:
    - 'Pando, Fishlake National Forest, Utah: one male clone of about 47,000 stems over 43 ha, among the
      heaviest known organisms; its age is uncertain, with estimates from several thousand to tens of
      thousands of years'
  game_fit:
    fields:
      liminality: 'high: trembling, whispering leaves and the Cross legend; whole groves are one hidden
        organism'
    dimensions: []
    hooks:
    - fast pioneer that refills burned or cleared ground
    - groves as one connected clone (cut one stem and the grove resprouts)
    - soft white wood for early boxes and matches
    - carving signs into bark as a player mark
  sources:
