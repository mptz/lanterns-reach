    grain: straight, fibrous, with prominent nodes
    texture: fine, with visible vascular bundles
    density_kg_m3: 700
    janka_n: 6270
    workability: splits very easily along the culm; strong in tension; hard on tools because of silica
    rot_resistance: perishable outdoors and very prone to powder-post beetles unless treated
    scent: null
    fuel: burns fast; culms burst when heated unless split; bamboo charcoal (takesumi) is made from it
    uses:
    - scaffolding
    - house frames
    - flooring and laminated boards
    - mats and baskets
    - chopsticks
    - paper pulp
    - charcoal
  products:
    food:
    - spring bamboo shoots (takenoko in Japanese, sǔn in Chinese), boiled to remove bitterness
    sap_resin_latex: []
    bark:
    - culm sheaths used to wrap food and make hats and sandals
    leaves:
    - leaves used to wrap rice dumplings
    dyes: []
    medicinal:
    - tabasheer, a siliceous concretion from the culms of tropical bamboos, in traditional Asian medicine
    toxicity: raw shoots contain cyanogenic glycosides (taxiphyllin) and must be boiled before eating
  lore:
    folklore:
    - The Tale of the Bamboo Cutter (Taketori Monogatari), in which Kaguya-hime is found inside a glowing
      bamboo culm and later returns to the Moon
    - '''Bamboo flowering brings famine'': mass flowering feeds rat plagues in parts of Asia'
    cultures:
    - Chinese literati painting (ink bamboo)
    - the Seven Sages of the Bamboo Grove
    - Japanese tea-ceremony utensils and kadomatsu New Year decorations
    symbolism:
    - one of the Four Gentlemen and one of the Three Friends of Winter (with pine and plum) in Chinese
      culture
    - integrity and resilience (bends but does not break)
    - hollow culm read as humility
    notable_trees:
    - Sagano (Arashiyama) bamboo grove, Kyoto
    - Shunan Bamboo Sea (Shunan Zhuhai), Sichuan
  game_fit:
