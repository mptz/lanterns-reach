  rank: species
  stands_for: []
  distinct_from:
  - 'american-beech: American beech is the North American species'
  - 'oriental-beech: oriental beech is the Caucasian and Anatolian species'
  tier: 1
  status: extant
  inclusion:
  - well-known
  - cultural
  - striking
  - product
  habitat:
    range: Europe from southern Scandinavia and southern England to Sicily, and from northern Spain to
      northwest Turkey
    ecosystem: temperate deciduous and montane mixed forest
    climate:
      temperature:
      - cool-temperate
      moisture:
      - humid
      note: null
    elevation_m:
    - 0
    - 2000
    substrate: well-drained soils of many types, acid to chalk; avoids waterlogging and very dry soils
    niche: dominant tree of lowland and montane beechwoods, often in near-pure stands with a bare, shaded
      floor
    strata:
    - canopy
    shade_tolerance: tolerant
    period: null
  form:
    habit: single straight trunk, broad domed crown; open-grown trees with low spreading limbs
    height_m:
    - 30
    - 40
    trunk_diameter_m:
    - 1.0
    - 2.0
    lifespan_y: 300
    growth_rate: moderate
    leaves: deciduous broadleaf, oval to elliptic about 10 × 7 cm, wavy-edged, glossy dark green; deep
      purple in copper beech
    seasonal: copper-orange in autumn; young trees and clipped hedges keep dry brown leaves through winter
    flowers: inconspicuous; tassel-like male catkins and paired female flowers with the new leaves in
      spring
    fruit_visible: bristly four-lobed woody husks splitting to release triangular brown beechnuts (mast),
      heavy crops every 5–8 years
    bark: smooth, thin, silver-grey throughout life
  timber:
    heartwood: pale cream to pinkish brown; steamed beech is evenly pink-brown; old trees may have dark
      "red heart"
    sapwood: not distinct
    grain: straight, with conspicuous ray flecks on quartered faces
    texture: fine, even
    density_kg_m3: 710
    janka_n: 6460
    workability: works, turns and steam-bends very well; moves a lot with humidity
    rot_resistance: perishable
    scent: null
    fuel: excellent firewood and charcoal; beech wood smokes hams and beer malt
    uses:
    - chairs and bentwood furniture
    - tool handles and planes
    - workbenches
    - cooking spoons
    - flooring
    - plywood
    - smoking wood
    - charcoal
  products:
    food:
    - beechnuts eaten roasted or pressed for oil
    - especially in famine years; mast fattens pigs (pannage)
    sap_resin_latex: []
    bark: []
    leaves:
    - young leaves eaten in salads
    dyes: []
    medicinal:
    - beech tar creosote formerly used as an antiseptic and expectorant
    toxicity: raw beechnuts in quantity cause digestive upset (fagin, saponins) in people and horses
  lore:
    folklore:
    - Germanic runes were cut on beech tablets; the English word "book" and German "Buch" share a root
      with beech (Buche)
    - lovers' and travellers' inscriptions carved into the smooth bark stay legible for decades
    cultures:
    - beech mast pannage for pigs in medieval forests
    - Chiltern chair bodgers turning beech legs in the woods
    symbolism:
    - national tree of Denmark
    notable_trees:
    - Ancient and Primeval Beech Forests of the Carpathians and Other Regions of Europe (UNESCO World
      Heritage)
    - Süntelbuche twisted beeches (Fagus sylvatica var. suentelensis), Germany
  game_fit:
    fields:
      yield: 'high: heavy mast years feed game and pigs'
    dimensions: []
    hooks:
    - steam-bent furniture
    - beechwood smoking for food preservation
    - smooth bark as a carvable surface for player marks
